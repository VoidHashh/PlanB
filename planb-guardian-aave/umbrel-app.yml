manifestVersion: 1
id: planb-guardian-aave
category: finance
name: Guardián Aave
version: "0.10.1"
tagline: Vigila tu préstamo de Aave V3 y lo protege con una cartera de reserva
icon: https://raw.githubusercontent.com/VoidHashh/PlanB/main/planb-panel/icon.png
description: >-
  Vigila un préstamo de Aave V3 (Ethereum) con colateral WBTC: factor de salud,
  LTV, deuda y precio de liquidación, leídos de dos servidores que tienen que
  coincidir. Muestra la cartera de reserva y un panel de escalas con cuánto
  WBTC (y stable como último recurso) haría falta para cada caída de BTC.
  Fase 5: desarmado solo simula y avisa por Telegram; armado (en Ethereum o en
  Sepolia), firma con la clave de la cartera de reserva (fichero privado) y
  aporta WBTC o paga deuda en nombre de la principal. Si Aave no acepta el
  WBTC, paga con la stable en su lugar. Calcula el ETH que necesita la reserva
  para el gas en una caída y avisa si no alcanza. Manda un resumen diario por
  Telegram como señal de que sigue vivo. Armar pide una contraseña propia
  (fichero privado) y desarmar lo detiene al momento. Corre sin root e imagen
  fijada por versión y huella.
